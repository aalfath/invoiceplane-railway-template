# Railway additions for InvoicePlane.
ServerName localhost
ServerTokens Prod
ServerSignature Off

# /healthz: Railway health check (no login), served outside the web root.
Alias /healthz /var/www/railway/healthz.php
<Directory /var/www/railway>
    Options None
    AllowOverride None
    Require all granted
</Directory>

# Fit the 0.5 GB plans: few prefork workers, recycled now and then.
<IfModule mpm_prefork_module>
    StartServers            2
    MinSpareServers         1
    MaxSpareServers         3
    MaxRequestWorkers       ${APACHE_MAX_WORKERS}
    MaxConnectionsPerChild  500
</IfModule>

SetEnvIf Request_URI "^/healthz$" dontlog
SetEnvIf User-Agent "internal dummy connection" dontlog

# Railway terminates TLS at its edge and forwards plain HTTP with X-Forwarded-Proto.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

# Railway's edge connects from changing public addresses and sets X-Real-IP to the visitor's
# address, replacing any value the visitor sent (checked 2026-11-23). Use it as the client IP, so
# InvoicePlane's per-IP login and password-reset limits count each visitor, not the edge.
# No proxy list: the service is only reachable through the edge or the project's private network.
<IfModule remoteip_module>
    RemoteIPHeader X-Real-IP
</IfModule>
